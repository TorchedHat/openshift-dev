# DRA GPU allocation. The classic nvidia.com/gpu device plugin is DISABLED cluster-wide, so
# GPUs are requested via DRA ResourceClaims. This "any GPU" template (1 GPU, no bus pinning) is
# created in the same namespace; the pod references it below (spec.template.spec.resourceClaims)
# and the container consumes it (resources.claims). Applying this file creates the template and
# the Deployment together; idempotent if gpu-1 already exists in this namespace.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-1
  namespace: <username>
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: <username>-rdma-dev
  namespace: <username>
spec:
  replicas: 0
  selector:
    matchLabels:
      app: <username>-rdma-dev
  template:
    metadata:
      labels:
        app: <username>-rdma-dev
    spec:
      # DRA: one GPU from the gpu-1 ResourceClaimTemplate (replaces classic nvidia.com/gpu).
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-1
      volumes:
        - name: ssh-key
          secret:
            secretName: <username>-git-ssh-key
            items:
              - key: ssh-privatekey
                path: id_ed25519
              - key: ssh-publickey
                path: id_ed25519.pub
              - key: known_hosts
                path: known_hosts
            defaultMode: 0640
        - name: gcloud-config
          secret:
            secretName: <username>-gcloud-config
            defaultMode: 0640
        - name: pytorch-eco-data
          persistentVolumeClaim:
            claimName: pytorch-py3-10-<username>
        - name: bazelrc
          configMap:
            name: bazelrc
        - name: gdbinit
          configMap:
            name: gdbinit
        - name: init-script
          configMap:
            name: init-script
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
        - name: claude-config
          emptyDir: {}
      initContainers:
        - name: init-container
          image: 'quay.io/rh-ee-sampark/devcontainers:py3.10'
          command:
            - /bin/bash
            - /scripts/configure_data_dir.sh
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /mnt/data
            - name: init-script
              mountPath: /scripts
      containers:
        - resources:
            limits:
              cpu: '16'
              memory: 128Gi
              rdma/rdma_shared_device_a: '1'
            requests:
              cpu: '4'
              memory: 64Gi
              rdma/rdma_shared_device_a: '1'
            # GPU comes from the DRA claim, not nvidia.com/gpu.
            claims:
              - name: gpu
          stdin: true
          terminationMessagePath: /dev/termination-log
          name: container
          env:
          - name: CLAUDE_CONFIG_DIR
            value: /home/devuser/.claude
          - name: GCE_METADATA_HOST
            value: "127.0.0.1:1"
          - name: MAX_JOBS
            value: "8"
          - name: NCCL_IB_DISABLE
            value: "0"
          - name: NCCL_NET_GDR_LEVEL
            value: "5"
          - name: MASTER_ADDR
            value: "<master-service-name>"
          - name: MASTER_PORT
            value: "29500"
          - name: WORLD_SIZE
            value: "<total-ranks>"
          - name: RANK
            value: "<rank>"
          command:
            - /bin/bash
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 29500
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: ssh-key
              readOnly: true
              mountPath: /home/devuser/.ssh
            - name: gcloud-config
              readOnly: true
              mountPath: /home/devuser/.config/gcloud
            - name: bazelrc
              mountPath: /home/devuser/.bazelrc
              subPath: .bazelrc
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: dshm
              mountPath: /dev/shm
            - name: claude-config
              mountPath: /home/devuser/.claude
          terminationMessagePolicy: File
          tty: true
          image: 'quay.io/rh-ee-sampark/devcontainers:py3.10'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: rh-ee-sampark-dev-bot-pull-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
