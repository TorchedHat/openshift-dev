name: PR Build Check (Runtime)

# One runtime image per cuda-version (python-agnostic -- see build-push-runtime.yml).

on:
  pull_request:
    paths:
      - '.devcontainer/runtime.Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda-version: ['13.0', '13.1']
        include:
          - cuda-version: '13.0'
          - cuda-version: '13.1'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - name: Build runtime image (CUDA ${{ matrix.cuda-version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/runtime.Dockerfile
          push: false
          build-args: |
            CUDA_VERSION=${{ matrix.cuda-version }}
