name: PR Build Check

on:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/nvshmem.Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        cuda-version: ['13.0', '13.1']
        include:
          - cuda-version: '13.0'
          - cuda-version: '13.1'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - name: Build image (Python ${{ matrix.python-version }}, CUDA ${{ matrix.cuda-version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          build-args: |
            PY_VER=${{ matrix.python-version }}
            FEDORA_VERSION=${{ matrix.fedora-version }}
            CUDA_VERSION=${{ matrix.cuda-version }}
            CUDNN_VERSION=${{ matrix.cudnn-version }}
            CUDNN_CUDA_SUFFIX=${{ matrix.cudnn-cuda-suffix }}
            GCC_SUFFIX=${{ matrix.gcc-suffix }}
