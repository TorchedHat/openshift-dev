name: Build and Push to Quay

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        cuda-version: ['12.9', '13.0']
        include:
          - cuda-version: '12.9'
            fedora-version: '41'
            cudnn-version: '9.6.0.74'
            cudnn-cuda-suffix: 'cuda12'
            gcc-suffix: '-13'
          - cuda-version: '13.0'
            fedora-version: '42'
            cudnn-version: '9.15.0.58'
            cudnn-cuda-suffix: 'cuda13'
            gcc-suffix: ''
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          build-args: |
            PY_VER=${{ matrix.python-version }}
            FEDORA_VERSION=${{ matrix.fedora-version }}
            CUDA_VERSION=${{ matrix.cuda-version }}
            CUDNN_VERSION=${{ matrix.cudnn-version }}
            CUDNN_CUDA_SUFFIX=${{ matrix.cudnn-cuda-suffix }}
            GCC_SUFFIX=${{ matrix.gcc-suffix }}
          tags: |
            quay.io/rh-ee-sampark/devcontainers:py${{ matrix.python-version }}${{ matrix.cuda-version != '12.9' && format('-cuda{0}', matrix.cuda-version) || '' }}
            ${{ matrix.python-version == '3.10' && matrix.cuda-version == '12.9' && 'quay.io/rh-ee-sampark/devcontainers:latest' || '' }}