apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: hostnetwork-anyuid
  annotations:
    kubernetes.io/description: >-
      Clone of the built-in hostnetwork SCC but with runAsUser: RunAsAny so pods
      may run with an arbitrary fixed UID (e.g. 1000) while using host networking
      and host ports. Does NOT grant privileged containers. SETUID/SETGID are kept
      (not dropped) so setuid-root binaries such as sudo work for the non-root UID.
      Created for RDMA dev containers that require host networking.
# Host networking + host ports, like the built-in hostnetwork SCC
allowHostNetwork: true
allowHostPorts: true
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostPID: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
# Permit SETUID/SETGID so setuid-root binaries (e.g. sudo) can switch users, and
# IPC_LOCK so RDMA/NVSHMEM pods can pin (mlock) memory for ibv_reg_mr. Additive: pods
# that don't request these caps are unaffected.
allowedCapabilities:
- SETUID
- SETGID
- IPC_LOCK
defaultAddCapabilities: null
# Keep the standard hostnetwork drops, but do NOT drop SETUID/SETGID (breaks sudo)
requiredDropCapabilities:
- KILL
- MKNOD
readOnlyRootFilesystem: false
# The one difference from hostnetwork: allow any UID (pod requests runAsUser 1000)
runAsUser:
  type: RunAsAny
fsGroup:
  type: MustRunAs
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- image
- persistentVolumeClaim
- projected
- secret
users: []
groups: []
