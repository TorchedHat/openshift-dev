apiVersion: v1
kind: ConfigMap
metadata:
  name: bazelrc
  namespace: <username>
data:
  .bazelrc: |
    build --local_resources=memory=HOST_RAM*0.5 
    build --local_resources=cpu=8
    build --disk_cache=/home/devuser/bazel-cache
    build --compilation_mode=dbg
    build --spawn_strategy=local
    build --genrule_strategy=local
