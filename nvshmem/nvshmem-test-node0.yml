# NVSHMEM cross-node test pod — NODE 0 / master.
# Pinned to worker-3-s4fxf, whose mlx5_0 fabric IP is 10.7.0.4 (== MASTER_ADDR).
# Mirror of node1 with a different nodeName; see README.md.
#
# Requirements this spec provides (all needed for NVSHMEM/IBRC over RoCE):
#   * hostNetwork: true                     -> host RDMA-fabric netdevs / IPs visible
#   * rdma/rdma_shared_device_a: 1           -> injects /dev/infiniband/* verbs devices
#   * securityContext capabilities: IPC_LOCK -> allow pinning/registering RDMA memory
#   * nvidia.com/gpu: 2                       -> 2 ranks/node in the example
# The container IMAGE must additionally provide a PyTorch build with the
# symmetric_memory NVSHMEM backend and the NVSHMEM runtime lib (libnvshmem*).
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nvshmem-test-node0
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvshmem-test-node0
  template:
    metadata:
      labels:
        app: nvshmem-test-node0
    spec:
      nodeName: pytorch-openshift-tjqvv-worker-3-s4fxf
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: container
          image: 'quay.io/rh-ee-allin/devcontainer-cuda:py3.12'
          command: ["/bin/bash", "-c", "sleep infinity"]
          stdin: true
          tty: true
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '2'
              rdma/rdma_shared_device_a: '1'
            limits:
              cpu: '16'
              memory: 128Gi
              nvidia.com/gpu: '2'
              rdma/rdma_shared_device_a: '1'
          env:
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_NET_GDR_LEVEL
              value: "5"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        capabilities:
          add: ["IPC_LOCK"]
      imagePullSecrets:
        - name: allin-image-registry
