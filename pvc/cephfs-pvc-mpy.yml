apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pytorch-ibmc-storage-<username>
  namespace: <username>
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
  storageClassName: ocs-storagecluster-cephfs
