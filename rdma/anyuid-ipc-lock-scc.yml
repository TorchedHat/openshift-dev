apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: anyuid-ipc-lock
  annotations:
    kubernetes.io/description: >-
      anyuid-ipc-lock extends the anyuid SCC with IPC_LOCK capability,
      required for RDMA memory registration (ibv_reg_mr).
allowPrivilegedContainer: false
allowHostNetwork: false
allowHostPorts: false
allowHostPID: false
allowHostIPC: false
allowedCapabilities:
  - IPC_LOCK
defaultAddCapabilities: []
requiredDropCapabilities:
  - MKNOD
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
