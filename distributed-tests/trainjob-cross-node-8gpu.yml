# 8-GPU (2 nodes x 4) cross-node NVSHMEM TrainJob -> torch-cross-node-8gpu runtime.
# Launch via the pre-flight picker so the 4-bus symmetric template is stamped first:
#   ./dra-preflight-launch.py --gpus 4 --rct-name symmetric-gpu-run-4 \
#       --runtime clustertrainingruntimes.yml --trainjob trainjob-cross-node-8gpu.yml \
#       --trainjob-name symmem-8gpu
# Both pods pin the SAME 4 buses (symmetric-gpu-run-4) -> symmetric board positions.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: symmem-8gpu
  namespace: skpark-rh
spec:
  runtimeRef:
    name: torch-cross-node-8gpu
  trainer:
    image: quay.io/rh-ee-sampark/devcontainers:py3.10
    args: ["/workspace/test_symmem_internode.py"]
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        volumes:
          - name: test-script
            configMap:
              name: cross-node-test
        containers:
          - name: node
            volumeMounts:
              - name: test-script
                mountPath: /workspace
