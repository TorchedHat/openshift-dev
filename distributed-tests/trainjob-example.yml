# Example TrainJob: run the cross-node NVSHMEM test on the 4-GPU bucket (2 nodes x 2).
#
# The runtime supplies the whole pod (hostNetwork, RDMA, SCC, rendezvous wrapper).
# This TrainJob only:
#   * picks a bucket via runtimeRef.name
#   * supplies the workload script via spec.trainer.args (the wrapper runs
#     `torchrun ... "$@"`, so args = [<script> <script-args...>])
#   * mounts the test script into the pods via podTemplateOverrides
#
# The script is delivered as a ConfigMap (create it first, from the nvshmem test):
#   oc create configmap cross-node-test \
#     --from-file=test_symmem_internode.py=../nvshmem/test_symmem_internode.py -n skpark-rh
# Alternatively bake the script into the image and just set trainer.args to its path.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: symmem-internode
  namespace: skpark-rh
spec:
  runtimeRef:
    name: torch-cross-node-4gpu        # <-- swap to -2gpu / -8gpu to change scale
  trainer:
    # image supplies the /usr userspace + wrapper tools (bash/curl/iproute2) and a
    # CUDA/Fedora userspace matching the PVC's torch build; python+torch come from the
    # mounted dev PVC. Omit to use the runtime default. Selects CUDA variant, not python.
    image: quay.io/rh-ee-sampark/devcontainers:py3.10
    args: ["/workspace/test_symmem_internode.py"]
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        volumes:
          - name: test-script
            configMap:
              name: cross-node-test
        containers:
          - name: node
            volumeMounts:
              - name: test-script
                mountPath: /workspace
