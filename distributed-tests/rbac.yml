# ServiceAccount for the torch-cross-node orchestrator.
#
# The runtime pods run as this SA. The non-hostNetwork + DRA flow needs NO API access from
# the pods: the rendezvous rides pod DNS (Trainer's torch policy sets PET_MASTER_ADDR to the
# rank-0 pod's routable pod IP), and GPUs come from DRA ResourceClaims. So the only RBAC
# here is the SA itself. (The old hostNetwork flow's fabric-IP rendezvous ConfigMap + Role
# were removed — see git history if you ever need them.)
#
# SCC: the pods run a fixed non-root UID (runAsUser 1000) + IPC_LOCK (mlock for ibv_reg_mr),
# which no built-in SCC allows together. Bind the custom hostnetwork-anyuid SCC (it grants
# RunAsAny + IPC_LOCK; its hostNetwork capability is unused by these pods):
#   oc adm policy add-scc-to-user hostnetwork-anyuid -z torch-cross-node -n skpark-rh
#
# The entrypoint + railguard are delivered as a ConfigMap the runtimes mount at /opt/rz:
#   oc create configmap torch-cross-node-entrypoint-podnet \
#     --from-file=entrypoint.sh=rendezvous-entrypoint-podnet.sh \
#     --from-file=railguard.py=railguard.py -n skpark-rh
#
# NAMESPACE is skpark-rh (fixed): the runtimes mount the dev PVC pytorch-py3-10-skpark-rh,
# and a PVC is only mountable from its own namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: torch-cross-node
  namespace: skpark-rh
