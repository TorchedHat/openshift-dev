# torch-cross-node orchestrator: three PURELY CROSS-NODE runtimes, bucketed by GPU count.
# All are numNodes: 2 (RDMA fabric internode). They differ ONLY in numProcPerNode and the DRA
# claim they reference. Submit a job by referencing one from a TrainJob:
#   spec.runtimeRef.name: torch-cross-node-4gpu
#
#   Runtime                  layout        total GPUs   per-pod GPUs   DRA claim template
#   torch-cross-node-2gpu    2 nodes x 1        2            1         symmetric-gpu-run
#   torch-cross-node-4gpu    2 nodes x 2        4            2         symmetric-gpu-run-2
#   torch-cross-node-8gpu    2 nodes x 4        8            4         symmetric-gpu-run-4
#
# NON-hostNetwork + DRA (updated 2026-08-11). Two structural changes vs. the old hostNetwork
# runtimes:
#   1. NO hostNetwork/dnsPolicy/hostPort. The torch plugin hardcodes containerPort 29500; under
#      hostNetwork the apiserver forces hostPort=29500 (node-exclusive, un-overridable) which
#      collided with any other torchrun pod. On the OVN pod network the rank-0 pod DNS resolves
#      to a routable pod IP, so PET_MASTER_ADDR works directly and pods may even co-locate.
#      podAntiAffinity(hostname) still forces the 2 pods onto different nodes -> real internode
#      RDMA. RDMA data path uses the host mlx5 HCA via rdma_shared_device_a, bypassing the netns.
#   2. GPUs come from DRA, not the (now-disabled) classic nvidia.com/gpu device plugin. Both node
#      pods reference the SAME bus-pinned ResourceClaimTemplate -> identical physical board
#      position(s) -> same PIX mlx5 rail(s) -> symmetric by construction. dra-preflight-launch.py
#      re-stamps those templates to buses mutually free on >=2 nodes before launch (fallthrough on
#      contention). railguard.py runs at container start and pins each rank's NVSHMEM_HCA_LIST to
#      the mlx5 rail PIX to its GPU (NVSHMEM otherwise elects mlx5_0 -> wrong-rail drop); symmetry
#      itself is guaranteed by the bus-pinning above, so railguard is purely local (no abort).
#
# NAMESPACE: these run in skpark-rh (they mount the populated dev PVC pytorch-py3-10-skpark-rh,
# which is only mountable from its own namespace). The referenced ResourceClaimTemplates must
# exist in skpark-rh (see resourceclaimtemplate-symmetric-gpu.yml or let the pre-flight stamp them).
#
# Prereqs (in skpark-rh): apply rbac.yml; create the entrypoint ConfigMap from
# rendezvous-entrypoint-podnet.sh (name torch-cross-node-entrypoint-podnet, includes railguard.py);
# ensure the symmetric-gpu-run* ResourceClaimTemplates exist.
#
# TORCH / PYTHON come from the dev PVC (its miniconda + editable torch, which MUST be built with
# the NVSHMEM symmetric_memory backend), mounted at /home/devuser and shadowing the image. The
# IMAGE only supplies the /usr-level userspace + tools (bash, curl, iproute2, rdma-core) and a
# CUDA/Fedora userspace matching the PVC's torch build. Pulled with rh-ee-sampark-dev-bot-pull-secret.
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: torch-cross-node-2gpu
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 2
    torch:
      numProcPerNode: 1
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                # REQUIRED: the torch mlPolicy plugin uses this label to find the trainer node
                # replicatedJob and inject PET_* env + parallelism=numNodes. Without it the plugin
                # silently no-ops (single pod, no rendezvous env).
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                metadata:
                  labels:
                    app: torch-cross-node-2gpu
                spec:
                  serviceAccountName: torch-cross-node
                  imagePullSecrets:
                    - name: rh-ee-sampark-dev-bot-pull-secret
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 0
                    # The dev PVC is RWX CephFS with ~500k files; the SCC assigns an fsGroup, and
                    # the default (Always) recursive chown walks the whole volume on every pod
                    # start (minutes-long stall). OnRootMismatch skips the walk when the volume
                    # root already has the right group.
                    fsGroupChangePolicy: OnRootMismatch
                  # Force the 2 pods onto different nodes -> real internode RDMA test.
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - topologyKey: kubernetes.io/hostname
                          labelSelector:
                            matchLabels:
                              app: torch-cross-node-2gpu
                  # DRA: both node pods reference the SAME bus-pinned template -> same physical
                  # board -> symmetric. Pre-flight (dra-preflight-launch.py) re-stamps the bus.
                  resourceClaims:
                    - {name: gpu, resourceClaimTemplateName: symmetric-gpu-run}
                  containers:
                    - name: node
                      image: quay.io/rh-ee-sampark/devcontainers:py3.10
                      # Mutable :py3.10 tag (NVSHMEM layer added in place). Always pull so every
                      # node has the NVSHMEM userspace torch links against.
                      imagePullPolicy: Always
                      command: ["/bin/bash", "/opt/rz/entrypoint.sh"]
                      securityContext:
                        capabilities:
                          add: ["IPC_LOCK"]
                      env:
                        - name: IB_DEV
                          value: mlx5_0
                      resources:
                        # No nvidia.com/gpu -- the GPU comes from the DRA claim below.
                        requests: {cpu: "8", memory: 64Gi, rdma/rdma_shared_device_a: "1"}
                        limits:   {cpu: "16", memory: 128Gi, rdma/rdma_shared_device_a: "1"}
                        claims:
                          - name: gpu
                      volumeMounts:
                        - {name: pytorch-eco-data, mountPath: /home/devuser}
                        - {name: entrypoint, mountPath: /opt/rz}
                        - {name: dshm, mountPath: /dev/shm}
                  volumes:
                    # Populated dev PVC (miniconda + editable torch BUILT WITH the NVSHMEM
                    # backend). Shadows the dev image's empty /home/devuser. RWX CephFS ->
                    # mountable by both nodes' pods at once. Same PVC the rayclusters use.
                    - name: pytorch-eco-data
                      persistentVolumeClaim:
                        claimName: pytorch-py3-10-skpark-rh
                    - name: entrypoint
                      configMap: {name: torch-cross-node-entrypoint-podnet, defaultMode: 0555}
                    - name: dshm
                      emptyDir: {medium: Memory}
---
