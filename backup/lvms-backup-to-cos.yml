apiVersion: v1
kind: ServiceAccount
metadata:
  name: lvms-backup-coordinator
  namespace: nfs-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lvms-backup-coordinator
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "create", "delete", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lvms-backup-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lvms-backup-coordinator
subjects:
- kind: ServiceAccount
  name: lvms-backup-coordinator
  namespace: nfs-server
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lvms-backup-to-cos
  namespace: nfs-server
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          serviceAccountName: lvms-backup-coordinator
          containers:
          - name: coordinator
            image: quay.io/openshift/origin-cli:4.20
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e
              ENDPOINT="https://s3.ca-tor.cloud-object-storage.appdomain.cloud"
              BUCKET="pytorch-nfs-backup"

              NAMESPACES=$(oc get pvc --all-namespaces -o json | \
                python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              seen = set()
              for item in data['items']:
                ns = item['metadata']['namespace']
                sc = item['spec'].get('storageClassName', '')
                if sc == 'lvms-nvme-vg' and ns not in seen:
                  seen.add(ns)
                  print(ns)
              ")

              if [ -z "$NAMESPACES" ]; then
                echo "No lvms-nvme-vg PVCs found. Nothing to back up."
                exit 0
              fi

              FAILED=0
              for NS in $NAMESPACES; do
                echo "--- Backing up $NS ---"

                if ! oc get secret cos-backup-creds -n "$NS" &>/dev/null; then
                  oc get secret cos-backup-creds -n nfs-server -o json | \
                    python3 -c "
              import sys, json
              s = json.load(sys.stdin)
              s['metadata']['namespace'] = '$NS'
              for k in ['uid', 'resourceVersion', 'creationTimestamp', 'managedFields']:
                  s['metadata'].pop(k, None)
              json.dump(s, sys.stdout)
              " | oc apply -f -
                fi

                PVCS=$(oc get pvc -n "$NS" -o json | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for item in data['items']:
                if item['spec'].get('storageClassName', '') == 'lvms-nvme-vg':
                  print(item['metadata']['name'])
              ")

                for PVC_NAME in $PVCS; do
                  JOB_NAME="daily-backup-${PVC_NAME}"
                  oc delete job "$JOB_NAME" -n "$NS" --ignore-not-found 2>/dev/null

                  cat <<JOBEOF | oc apply -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ${JOB_NAME}
                namespace: ${NS}
                labels:
                  app: lvms-daily-backup
              spec:
                backoffLimit: 2
                activeDeadlineSeconds: 7200
                template:
                  spec:
                    nodeSelector:
                      node.kubernetes.io/instance-type: gx3d.160x1792.8h200
                    containers:
                    - name: backup
                      image: amazon/aws-cli:latest
                      command: ["/bin/sh", "-c"]
                      args:
                      - |
                        aws configure set aws_access_key_id "\$AWS_ACCESS_KEY_ID"
                        aws configure set aws_secret_access_key "\$AWS_SECRET_ACCESS_KEY"
                        aws configure set default.region ca-tor
                        echo "Starting backup for ${NS}/${PVC_NAME} at \$(date)"
                        find /source -type f -executable -printf '%P\n' > /tmp/.executable-manifest
                        aws --endpoint-url ${ENDPOINT} \
                          s3 sync /source/ s3://${BUCKET}/${NS}/${PVC_NAME}/ \
                          --delete \
                          --exclude '.executable-manifest' \
                          --no-follow-symlinks \
                          --only-show-errors
                        aws --endpoint-url ${ENDPOINT} \
                          s3 cp /tmp/.executable-manifest s3://${BUCKET}/${NS}/${PVC_NAME}/.executable-manifest \
                          --only-show-errors
                        echo "Backup completed at \$(date)"
                      env:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: cos-backup-creds
                            key: access-key
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: cos-backup-creds
                            key: secret-key
                      volumeMounts:
                      - name: user-data
                        mountPath: /source
                        readOnly: true
                      resources:
                        requests:
                          cpu: "1"
                          memory: 2Gi
                        limits:
                          cpu: "2"
                          memory: 4Gi
                    restartPolicy: OnFailure
                    volumes:
                    - name: user-data
                      persistentVolumeClaim:
                        claimName: ${PVC_NAME}
              JOBEOF
                done
              done

              echo ""
              echo "Waiting for all backup jobs to complete..."
              for NS in $NAMESPACES; do
                JOBS=$(oc get jobs -n "$NS" -l app=lvms-daily-backup --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null)
                for JOB in $JOBS; do
                  if ! oc wait --for=condition=complete "job/$JOB" -n "$NS" --timeout=7200s 2>/dev/null; then
                    echo "WARN: $NS/$JOB did not complete successfully"
                    FAILED=$((FAILED + 1))
                  fi
                done
              done

              if [ $FAILED -gt 0 ]; then
                echo "$FAILED backup(s) failed"
                exit 1
              fi
              echo "All backups completed successfully"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
