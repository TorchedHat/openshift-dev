apiVersion: v1
kind: ServiceAccount
metadata:
  name: cephfs-backup
  namespace: openshift-storage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cephfs-backup-to-cos
  namespace: openshift-storage
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 14400
      template:
        spec:
          serviceAccountName: cephfs-backup
          containers:
          - name: backup
            image: registry.redhat.io/rhceph/rhceph-9-rhel9@sha256:ad4a6277b33df016fb7444fc729b59a8ecc78cd689f9607ff80c553ec52285ad
            command: ["/bin/bash", "-c"]
            args:
            - |
              export HOME=/tmp

              # install aws cli
              python3 -m ensurepip > /dev/null 2>&1
              python3 -m pip install awscli > /dev/null 2>&1

              # mount cephfs using admin credentials
              ADMIN_KEY=$(grep 'key =' /etc/ceph-admin/keyring | awk '{print $3}')
              CEPH_FSID=$(cat /etc/ceph-fsid/fsid)
              mkdir -p /mnt/cephfs
              mount -t ceph "admin@${CEPH_FSID}.ocs-storagecluster-cephfilesystem=/" /mnt/cephfs \
                -o "mon_addr=172.30.224.204:3300/172.30.170.219:3300/172.30.126.27:3300,secret=${ADMIN_KEY},ms_mode=prefer-crc" 2>/dev/null

              if [ ! -d /mnt/cephfs/volumes/csi ]; then
                echo "ERROR: CephFS mount failed"
                exit 1
              fi

              # configure aws
              aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
              aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
              aws configure set default.region us-east-3

              echo "Starting CephFS backup at $(date)"
              aws --endpoint-url https://s3.us-east.cloud-object-storage.appdomain.cloud \
                s3 sync /mnt/cephfs/volumes/csi/ s3://pytorch-cephfs-backup/ \
                --delete \
                --no-follow-symlinks \
                --only-show-errors
              echo "Backup completed at $(date)"

              umount /mnt/cephfs
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cos-backup-creds
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cos-backup-creds
                  key: secret-key
            securityContext:
              privileged: true
            volumeMounts:
            - name: admin-keyring
              mountPath: /etc/ceph-admin
              readOnly: true
            - name: ceph-fsid
              mountPath: /etc/ceph-fsid
              readOnly: true
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
              limits:
                cpu: "2"
                memory: 8Gi
          restartPolicy: OnFailure
          volumes:
          - name: admin-keyring
            secret:
              secretName: rook-ceph-admin-keyring
          - name: ceph-fsid
            secret:
              secretName: rook-ceph-mon
              items:
              - key: fsid
                path: fsid
