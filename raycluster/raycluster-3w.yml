# DRA GPU allocation. The classic nvidia.com/gpu device plugin is DISABLED cluster-wide, so
# GPUs are requested via DRA ResourceClaims. This "any GPU" template (1 GPU, no bus pinning) is
# created in the same namespace; the gpu-group worker pod references it below
# (spec.template.spec.resourceClaims) and the container consumes it (resources.claims). KubeRay
# no longer sees nvidia.com/gpu, so the group sets rayStartParams.num-gpus="1" to advertise the
# DRA-injected GPU to Ray. Applying this file creates the template and the RayCluster together;
# idempotent if gpu-1 already exists in this namespace.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-1
  namespace: <username>
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-3w
  namespace: <username>
spec:
  rayVersion: "3.0.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    version: v2
    upscalingMode: Default
    idleTimeoutSeconds: 60
    imagePullPolicy: Always
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
    env: []
    envFrom: []
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "0"
      no-monitor: "true"
    template:
      metadata: {}
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        initContainers:
        - name: init-container
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          command:
            - /bin/bash
            - /scripts/configure_data_dir.sh
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /mnt/data
            - name: init-script
              mountPath: /scripts
        - name: install-editable-ray
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              SITE=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
              rm -rf "$SITE/ray" "$SITE"/ray-*.dist-info
              echo "import sys; sys.path.insert(0, '/home/devuser/devcontainers/ray/python')" > "$SITE/ray-editable.pth"
              BIN=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['scripts'])")
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.scripts.scripts import main\nmain()\n' > "$BIN/ray" && chmod +x "$BIN/ray"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.tune.cli.scripts import cli\ncli()\n' > "$BIN/tune" && chmod +x "$BIN/tune"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.serve.scripts import cli\ncli()\n' > "$BIN/serve" && chmod +x "$BIN/serve"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
        containers:
        - name: ray-head
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 16
              memory: 128Gi
            requests:
              cpu: 4
              memory: 16Gi
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8000
            name: serve
          env:
          - name: CPU_REQUEST
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: requests.cpu
          - name: CPU_LIMITS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: limits.cpu
          - name: MEMORY_LIMITS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: limits.memory
          - name: MEMORY_REQUESTS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: requests.memory
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: ""
          - name: CLAUDE_CONFIG_DIR
            value: /home/devuser/.claude
          - name: GCE_METADATA_HOST
            value: "127.0.0.1:1"
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: ssh-key
              readOnly: true
              mountPath: /home/devuser/.ssh
            - name: gcloud-config
              readOnly: true
              mountPath: /home/devuser/.config/gcloud
            - name: claude-config
              mountPath: /home/devuser/.claude
            - name: bazelrc
              mountPath: /home/devuser/.bazelrc
              subPath: .bazelrc
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: dshm
              mountPath: /dev/shm
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: ssh-key
            secret:
              secretName: <username>-git-ssh-key
              items:
                - key: ssh-privatekey
                  path: id_ed25519
                - key: ssh-publickey
                  path: id_ed25519.pub
                - key: known_hosts
                  path: known_hosts
              defaultMode: 0640
          - name: gcloud-config
            secret:
              secretName: <username>-gcloud-config
              defaultMode: 0640
          - name: claude-config
            emptyDir: {}
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-py3-10-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: bazelrc
            configMap:
              name: bazelrc
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory
  workerGroupSpecs:
  - groupName: cpu-group
    replicas: 0
    minReplicas: 0
    maxReplicas: 3
    rayStartParams: {}
    template:
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        initContainers:
        - name: install-editable-ray
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              SITE=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
              rm -rf "$SITE/ray" "$SITE"/ray-*.dist-info
              echo "import sys; sys.path.insert(0, '/home/devuser/devcontainers/ray/python')" > "$SITE/ray-editable.pth"
              BIN=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['scripts'])")
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.scripts.scripts import main\nmain()\n' > "$BIN/ray" && chmod +x "$BIN/ray"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.tune.cli.scripts import cli\ncli()\n' > "$BIN/tune" && chmod +x "$BIN/tune"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.serve.scripts import cli\ncli()\n' > "$BIN/serve" && chmod +x "$BIN/serve"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
        containers:
        - name: ray-cpu-worker
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 8
              memory: 50Gi
            requests:
              cpu: 8
              memory: 50Gi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: init-script
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: RAY_DISABLE_DOCKER_CPU_WARNING
              value: "1"
            - name: TYPE
              value: "worker"
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: requests.cpu
            - name: CPU_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: limits.cpu
            - name: MEMORY_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: limits.memory
            - name: MEMORY_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: requests.memory
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
          - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-py3-10-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory
  - groupName: gpu-group
    replicas: 3
    minReplicas: 3
    maxReplicas: 10
    # GPUs come from DRA (nvidia.com/gpu is gone), so KubeRay can't infer num-gpus from the
    # container limit — advertise the DRA-injected GPU to Ray explicitly.
    rayStartParams:
      num-gpus: "1"
    template:
      spec:
        # DRA: one GPU from the gpu-1 ResourceClaimTemplate (replaces classic nvidia.com/gpu).
        resourceClaims:
          - name: gpu
            resourceClaimTemplateName: gpu-1
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        initContainers:
        - name: install-editable-ray
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              SITE=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
              rm -rf "$SITE/ray" "$SITE"/ray-*.dist-info
              echo "import sys; sys.path.insert(0, '/home/devuser/devcontainers/ray/python')" > "$SITE/ray-editable.pth"
              BIN=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['scripts'])")
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.scripts.scripts import main\nmain()\n' > "$BIN/ray" && chmod +x "$BIN/ray"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.tune.cli.scripts import cli\ncli()\n' > "$BIN/tune" && chmod +x "$BIN/tune"
              printf '#!/home/devuser/miniconda/bin/python3\nfrom ray.serve.scripts import cli\ncli()\n' > "$BIN/serve" && chmod +x "$BIN/serve"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
        containers:
        - name: ray-gpu-worker
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 8
              memory: 50Gi
              rdma/rdma_shared_device_a: "1"
            requests:
              cpu: 8
              memory: 50Gi
              rdma/rdma_shared_device_a: "1"
            # GPU comes from the DRA claim, not nvidia.com/gpu.
            claims:
              - name: gpu
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: init-script
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: RAY_DISABLE_DOCKER_CPU_WARNING
              value: "1"
            - name: TYPE
              value: "worker"
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: requests.cpu
            - name: CPU_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: limits.cpu
            - name: MEMORY_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: limits.memory
            - name: MEMORY_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: requests.memory
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
          - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-py3-10-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory