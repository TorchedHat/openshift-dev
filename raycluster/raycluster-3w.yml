apiVersion: ray.io/v1alpha1
kind: RayCluster
metadata:
  name: raycluster-3w
  namespace: <username>
spec:
  rayVersion: "3.0.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    version: v2
    upscalingMode: Default
    idleTimeoutSeconds: 60
    imagePullPolicy: Always
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
    env: []
    envFrom: []
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "0"
      no-monitor: "true"
    template:
      metadata: {}
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        initContainers:
        - name: init-container
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          command:
            - /bin/bash
            - /scripts/configure_data_dir.sh
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /mnt/data
            - name: init-script
              mountPath: /scripts
        containers:
        - name: ray-head
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 16
              memory: 128Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: 4
              memory: 16Gi
              nvidia.com/gpu: '1'
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8000
            name: serve
          env:
          - name: CPU_REQUEST
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: requests.cpu
          - name: CPU_LIMITS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: limits.cpu
          - name: MEMORY_LIMITS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: limits.memory
          - name: MEMORY_REQUESTS
            valueFrom:
              resourceFieldRef:
                containerName: ray-head
                resource: requests.memory
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: ssh-key
              readOnly: true
              mountPath: /home/devuser/.ssh
            - name: gcloud-config
              readOnly: true
              mountPath: /home/devuser/.config/gcloud
            - name: bazelrc
              mountPath: /home/devuser/.bazelrc
              subPath: .bazelrc
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: dshm
              mountPath: /dev/shm
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: ssh-key
            secret:
              secretName: <username>-git-ssh-key
              items:
                - key: ssh-privatekey
                  path: id_ed25519
                - key: ssh-publickey
                  path: id_ed25519.pub
                - key: known_hosts
                  path: known_hosts
              defaultMode: 0640
          - name: gcloud-config
            secret:
              secretName: <username>-gcloud-config
              defaultMode: 0640
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-ibmc-storage-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: bazelrc
            configMap:
              name: bazelrc
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory
  workerGroupSpecs:
  - groupName: cpu-group
    replicas: 0
    minReplicas: 0
    maxReplicas: 3
    rayStartParams: {}
    template:
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        containers:
        - name: ray-cpu-worker
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 8
              memory: 50Gi
            requests:
              cpu: 8
              memory: 50Gi
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: init-script
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: RAY_DISABLE_DOCKER_CPU_WARNING
              value: "1"
            - name: TYPE
              value: "worker"
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: requests.cpu
            - name: CPU_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: limits.cpu
            - name: MEMORY_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: limits.memory
            - name: MEMORY_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-cpu-worker
                  resource: requests.memory
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
          - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-ibmc-storage-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory
  - groupName: gpu-group
    replicas: 2
    minReplicas: 2
    maxReplicas: 10
    rayStartParams: {}
    template:
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
        containers:
        - name: ray-gpu-worker
          image: quay.io/rh-ee-sampark/devcontainers:py3.10
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 8
              memory: 50Gi
              nvidia.com/gpu: "1"
              rdma/rdma_shared_device_a: "1"
            requests:
              cpu: 8
              memory: 50Gi
              nvidia.com/gpu: "1"
              rdma/rdma_shared_device_a: "1"
          volumeMounts:
            - name: pytorch-eco-data
              mountPath: /home/devuser
            - name: gdbinit
              mountPath: /home/devuser/.gdbinit
              subPath: .gdbinit
            - name: init-script
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: RAY_DISABLE_DOCKER_CPU_WARNING
              value: "1"
            - name: TYPE
              value: "worker"
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: requests.cpu
            - name: CPU_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: limits.cpu
            - name: MEMORY_LIMITS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: limits.memory
            - name: MEMORY_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: ray-gpu-worker
                  resource: requests.memory
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
          - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
        imagePullSecrets:
          - name: rh-ee-sampark-dev-bot-pull-secret
        volumes:
          - name: pytorch-eco-data
            persistentVolumeClaim:
              claimName: pytorch-ibmc-storage-<username>
          - name: gdbinit
            configMap:
              name: gdbinit
          - name: init-script
            configMap:
              name: init-script
              defaultMode: 0755
          - name: dshm
            emptyDir:
              medium: Memory