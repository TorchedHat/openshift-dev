apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc:9091
      uid: PBFA97CFB590B2093
      isDefault: true
      jsonData:
        httpHeaderName1: Authorization
        tlsSkipVerify: true
        timeInterval: 30s
      secureJsonData:
        httpHeaderValue1: "Bearer <GRAFANA_TOKEN>"
