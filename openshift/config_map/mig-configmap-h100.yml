apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-mig-config-h100
  namespace: nvidia-gpu-operator
data:
  config.yaml: |
    version: v1
    mig-configs:
      custom-mix-h100:
        - devices: [0,1]
          mig-enabled: true
          mig-devices:
            1g.10gb: 7
        - devices: [2,3]
          mig-enabled: true
          mig-devices:
            2g.20gb: 3
        - devices: [4,5,6,7]
          mig-enabled: false
      custom-mix-h100-lite:
        - devices: [0]
          mig-enabled: true
          mig-devices:
            1g.10gb: 7
        - devices: [1]
          mig-enabled: true
          mig-devices:
            2g.20gb: 3
        - devices: [2,3,4,5,6,7]
          mig-enabled: false
